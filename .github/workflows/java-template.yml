name: Java Build, Containerize & Deploy via Helm
on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '17'
  HELM_CHART_PATH: ./helm/app
jobs:
  # ----------------------------------------------------------------------
  # 1. Build & test the Java application
  # ----------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'   # change to 'gradle' if using Gradle
      # --- Maven ---
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
      # --- Gradle (uncomment if using Gradle instead) ---
      # - name: Grant execute permission for gradlew
      #   run: chmod +x ./gradlew
      # - name: Build with Gradle
      #   run: ./gradlew clean build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar   # use build/libs/*.jar for Gradle
          retention-days: 1
  # ----------------------------------------------------------------------
  # 2. Build & push the Docker image
  # ----------------------------------------------------------------------
  containerize:
    name: Build & Push Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ----------------------------------------------------------------------
  # 3. Deploy with Helm
  # ----------------------------------------------------------------------
  deploy:
    name: Deploy via Helm
    needs: containerize
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Lint Helm chart
        run: helm lint ${{ env.HELM_CHART_PATH }}
      - name: Deploy / upgrade release
        run: |
          helm upgrade --install ${{ github.event.repository.name }} ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ github.event.inputs.environment || 'staging' }} \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.containerize.outputs.image-tag }} \
            --wait \
            --timeout 5m \
            --atomic
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ github.event.repository.name }} \
            --namespace ${{ github.event.inputs.environment || 'staging' }} \
            --timeout=120s